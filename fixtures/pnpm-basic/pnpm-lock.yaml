lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0
      tiny-invariant:
        specifier: ^1.3.3
        version: 1.3.3
    devDependencies:
      typescript:
        specifier: ^5.9.0
        version: 5.9.2
    optionalDependencies:
      fsevents:
        specifier: ^2.3.3
        version: 2.3.3

packages:
  react@18.2.0:
    resolution: {integrity: sha512-react}
  tiny-invariant@1.3.3:
    resolution: {integrity: sha512-tiny}
  typescript@5.9.2:
    resolution: {integrity: sha512-ts}
  fsevents@2.3.3:
    resolution: {integrity: sha512-fsevents}
