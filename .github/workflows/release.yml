name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted publishing: npm exchanges this token for a short-lived credential, so nothing
  # long-lived is stored anywhere. There is no token fallback, by design.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          # Deliberately no cache here: a release must not be assembled from anything a
          # previous run left behind.
      # Trusted publishing needs npm 11.5.1 or newer, which is later than some Node 24
      # releases bundle. Pinning here removes the whole class of "OIDC silently did not
      # engage" for the cost of a few seconds.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: the tag names the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      - run: pnpm test
      - name: publish
        # A prerelease goes out under `beta` so `npm install -g agent-reference` keeps
        # resolving the last release anyone should be running.
        #
        # npm rather than pnpm, because the OIDC exchange lives in the npm CLI. No
        # --provenance flag: trusted publishing attests automatically, and a private source
        # repository cannot be attested at all, so naming it could only fail a publish that
        # would otherwise succeed. No NODE_AUTH_TOKEN either; there is no token to fall
        # back to.
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          npm publish --access public --tag "$tag"
