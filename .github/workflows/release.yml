name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Signs the published tarball, so npm can show where it was built from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer, which is later than some Node 24
      # releases bundle. Pinning to latest here costs seconds and removes the whole class of
      # "OIDC silently did not engage".
      - run: npm install -g npm@latest
      - run: npm ci
      - name: the tag names the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      - run: npm test
      - name: publish
        # A prerelease goes out under `beta` so `npm install -g agent-reference` keeps
        # resolving the last release anyone should be running.
        #
        # No --provenance flag: under trusted publishing npm attests automatically, and a
        # private source repository cannot be attested at all, so naming the flag can only
        # fail a publish that would otherwise succeed.
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          npm publish --access public --tag "$tag"
        env:
          # Only read when npm falls back from OIDC, which is the case until a trusted
          # publisher is configured for this package on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
