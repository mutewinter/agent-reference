name: release

on:
  push:
    tags: ['v*']
  # The same job, started by hand against a tag. A tag fires this once and only once, so an
  # Actions outage during that one moment strands a pushed tag with no way to reach it:
  # there is no run to re-run, and re-pushing the tag is what tag protection exists to stop.
  # Every step below reads the tag out of the ref either way, and the tag-matches-package.json
  # check still guards it, so dispatching against a tag does what pushing it would have.
  workflow_dispatch:

permissions:
  # Writing a release is the only thing here that touches the repository. Scoping it to its
  # own job would be theater next to the `id-token: write` below, which can publish to npm.
  contents: write
  # Trusted publishing: npm exchanges this token for a short-lived credential, so nothing
  # long-lived is stored anywhere. There is no token fallback, by design.
  id-token: write

env:
  # turbo prints a first-run telemetry notice into every log otherwise.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          # Deliberately no cache here: a release must not be assembled from anything a
          # previous run left behind.
      # Trusted publishing needs npm 11.5.1 or newer, which is later than some Node 24
      # releases bundle. Pinning here removes the whole class of "OIDC silently did not
      # engage" for the cost of a few seconds.
      - run: npm install -g npm@latest
      # `--ignore-scripts` skips the `prepare` build. The turbo run below depends on `build`
      # and `npm publish` fires `prepack`, so `dist/` is produced by the steps that own it
      # rather than as a side effect of installing.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: the tag names the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      # The same gates CI runs. A tag can be pushed from any commit, including one
      # CI never went green on, and `npm publish` is the only step in this
      # repository that cannot be taken back. The site's lint and typecheck are
      # deliberately not here: nothing about the site reaches the tarball.
      #
      # One turbo pass rather than four loose scripts, so the list cannot drift out of step
      # with `ci.yml` and so `test` picks up its dependency on `build`. `packaging.test.ts`
      # skips itself when `dist/` is absent, which is exactly the check the tarball about to
      # be published most needs; run as a bare script it would skip quietly and pass.
      # `--continue` so a failure in one reports the rest rather than hiding it.
      - run: pnpm exec turbo run format lint check-types test --continue=dependencies-successful
      - name: publish
        # A prerelease goes out under `beta` so `npm install -g agent-reference` keeps
        # resolving the last release anyone should be running.
        #
        # npm rather than pnpm, because the OIDC exchange lives in the npm CLI. No
        # --provenance flag: trusted publishing attests automatically, and a private source
        # repository cannot be attested at all, so naming it could only fail a publish that
        # would otherwise succeed. No NODE_AUTH_TOKEN either; there is no token to fall
        # back to.
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          npm publish --access public --tag "$tag"
      - name: release
        # A tag on its own leaves the repository's sidebar counting tags instead of naming a
        # version, which is the first thing a visitor who has not heard of this looks at.
        #
        # After the publish rather than before: a release pointing at a version npm does not
        # have is worse than no release. A prerelease is marked as one so it does not displace
        # the last release anyone should be running, the same call the dist-tag above makes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) flags=--prerelease ;;
            *) flags= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $flags
