name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite runs TypeScript sources directly, so it needs type stripping, and pnpm needs
    # Node 22.13 or newer to run at all. The higher of the two floors is the one that binds.
    # Neither is the tool's floor: the published package ships compiled JavaScript.
    name: test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  lint:
    # oxlint over both projects in this repository. The root config carries the
    # TypeScript and correctness rules; the site adds React and Tailwind on top
    # of them, which is where the design system is enforced: a size or a color
    # written into a class rather than declared in `@theme` fails here.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      # Type-aware rules read the real TypeScript program, so both projects have
      # to be installed rather than just checked out.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      # One formatter for the whole repository, run from the root: unlike the
      # type-aware rules it reads no TypeScript program, so it needs no install
      # of its own and covers both projects in one pass.
      - run: pnpm run format
      - run: pnpm run lint
      - run: pnpm --dir site run lint

  site:
    # Cloudflare Workers Builds deploys this on every push to main, so a build
    # that only fails there fails after the fact. Running it on pull requests is
    # the point at which it can still stop something. Deployment itself stays
    # with Workers Builds; there is no wrangler token in this repository.
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      # The root install is what the site build runs the CLI out of: the command
      # reference on the page is real output, generated by executing the CLI in
      # this checkout against a throwaway project.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      # `vite build` does not typecheck, so nothing else here would.
      - run: pnpm --dir site run check-types
      - run: pnpm --dir site run build

  install:
    # What `npm install -g agent-reference` actually produces, on the oldest Node the
    # package claims to support. Everything this catches is invisible from a source
    # checkout: a file left out of `files`, a bin without its executable mode, a runtime
    # read resolved against a path that only exists here.
    name: install the tarball on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
      # Two runtimes, deliberately. pnpm and the compiler need a recent Node; the whole
      # point of this job is the old one. So the tarball is built up here and the matrix
      # version is switched in underneath it, which is also how a user meets this package:
      # they never build it, they install what someone else built.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packed with npm, because that is the route a user takes.
      - run: npm pack
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g ./agent-reference-*.tgz
      - name: the commands that read shipped files
        run: |
          agent-reference version
          agent-reference schema > /dev/null
          agent-reference guide > /dev/null
          mkdir -p /tmp/smoke && cd /tmp/smoke && agent-reference init > /dev/null
